<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Students4AI — Your learning lab</title>
  <meta name="description" content="Interactive AP Calculus BC and AB learning, adaptive practice, and a Canvas study planner. Every module stays open.">
  <link rel="stylesheet" href="/styles.css">
  <!-- KaTeX is vendored locally so math always renders, with or without internet. -->
  <link rel="stylesheet" href="/vendor/katex/katex.min.css">
  <script defer src="/vendor/katex/katex.min.js"></script>
  <script defer src="/vendor/katex/contrib/auto-render.min.js"
          onload="window.dispatchEvent(new Event('katex-ready'))"></script>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%88%AB%3C/text%3E%3C/svg%3E">
</head>
<body>
  <a class="skip-link" href="#main">Skip to main content</a>

  <header class="app-header">
    <div class="header-inner">
      <a class="brand" href="#/home"><span aria-hidden="true">{∫}</span> Students4AI</a>
      <nav aria-label="Main navigation">
        <a href="#/home" data-nav="home">Home</a>
        <a href="#/focus" data-nav="focus">Study session</a>
        <a href="#/review" data-nav="review">Review</a>
        <a href="#/canvas" data-nav="canvas">Canvas</a>
        <a href="#/settings" data-nav="settings">Settings</a>
      </nav>
    </div>
  </header>

  <main id="main" class="app-main">
    <div id="study-controls" class="course-switcher" aria-label="Learning workspace"></div>
    <p id="focus-status" class="session-progress" hidden><a href="#/focus">Study session running · return to your plan</a></p>
    <div id="breadcrumb" class="breadcrumb" aria-label="You are here"></div>
    <div id="view" class="view"></div>
    <div id="page-coach-slot"></div>
  </main>

  <div id="live-region" class="visually-hidden" aria-live="polite"></div>

  <footer class="app-footer">
    <p>Students4AI · Explore at your pace. Progress saves after every answer.</p>
  </footer>

  <noscript><p class="noscript-note">Students4AI needs JavaScript to run.</p></noscript>
  <script type="module" src="/app.js"></script>
</body>
</html>

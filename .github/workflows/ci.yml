name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Syntax check
        run: |
          node --check server.js
          node --check auth.js
          node --check account-store.js
          node --check public/auth-ui.js
          node --check public/continuity-ui.js
          node --check continuity-store.js
          node --check scripts/create-enrollment.mjs
          node --check ai-coach.js
          node --check canvas-retrieval.js
          node --check study-coach-context.js
          node --check linked-documents.js
          node --check mixed-question-bank.js
          node --check mixed-practice.js
          node --check mixed-practice-api.js
          node --check public/page-coach.js
          node --check public/mixed-study.js
          node --check store.js
          node --check public/app.js
          node --check public/engine.js
          node --check public/viz.js
          node --check public/study-lab.js
          node --check public/spatial-lab.js
          node --check public/focus-planner.js
          node --check public/courses.js
          node --check public/canvas-insights.js
          node --check scripts/validate-content.mjs
          node --check scripts/check-math.mjs
          node --check scripts/qa-tools.mjs
          node --check scripts/lint-ui.mjs

      - name: Engine, Canvas-insights, and store unit tests
        run: npm test

      - name: Language lint of app text (CLAUDE.md invariant 3)
        run: npm run lint

      - name: Independent mastery bank and rubric validation
        run: node scripts/check-mastery-bank.mjs

      # Units land incrementally while the curriculum is authored; validate
      # every unit file that exists rather than failing on the ones to come.
      - name: Validate curriculum content
        run: |
          present=$(ls content/unit-*.json 2>/dev/null | xargs -r -n1 basename | sed 's/\.json$//')
          if [ -n "$present" ]; then
            node scripts/validate-content.mjs $present
            node scripts/check-math.mjs $present
            for u in $present; do node scripts/qa-tools.mjs lint $u; done
          else
            echo "No unit content files yet — skipping."
          fi
